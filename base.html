<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AjChatroom</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block extra_js %}{% endblock %}
</head>
<body>
<header>
<a class="brand" href="{{ url_for('chatrooms') if session.get('user_id') else url_for('login') }}">AjChatroom</a>
{% if session.get('user_id') %}
<nav><a href="{{ url_for('chatrooms') }}">Rooms</a> <a href="{{ url_for('logout') }}">Logout</a></nav>
{% endif %}
</header>
<main class="container">
{% with messages=get_flashed_messages(with_categories=true) %}
{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
